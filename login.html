<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MotionForge AI</title>
<meta name="description" content="Sign in to your studio.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="Sign in — MotionForge AI">
<meta property="og:description" content="Sign in to your studio.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d10'/%3E%3Cpath d='M22 68V32l14 22 14-22v36' stroke='%23ff8a3d' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{width:100%;max-width:400px}
.auth-card h1{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin:20px 0 6px}
.auth-card .lead{color:var(--text-secondary);font-size:13.5px;margin-bottom:24px}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.auth-footer{margin-top:22px;text-align:center;font-size:13px;color:var(--text-muted)}
.auth-footer a{color:var(--amber-500)}
.note{padding:10px 12px;border-radius:8px;background:rgba(139,109,255,.08);border:1px solid rgba(139,109,255,.25);font-size:12px;color:#c4b5fd;margin-bottom:20px}
</style>
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <a href="index.html" class="brand" style="display:inline-flex;align-items:center;gap:10px"><svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b0d10" stroke="#232a32"/><path d="M22 68V32l14 22 14-22v36" stroke="#ff8a3d" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 68V32h16a12 12 0 0 1 0 24H62" stroke="#a78bfa" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-brand style="font-family:var(--font-display);font-weight:600">MotionForge AI</span></a>
  <h1>Welcome back</h1>
  <p class="lead">Sign in to access your studio workspace.</p>
  <div class="note" id="mode-note">Local mode: any email and password (6+ chars) will work.</div>
  <form id="login-form">
    <label><span class="label">Email</span><input type="email" id="email" class="field mt-1" required autocomplete="email"></label>
    <label><span class="label">Password</span><input type="password" id="password" class="field mt-1" required minlength="6" autocomplete="current-password"></label>
    <div id="error" class="error-box hidden"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:11px">Sign in</button>
  </form>
  <div class="auth-footer">New here? <a href="signup.html">Create an account</a></div>
</div></div>
<script src="config.js"></script>
<script type="module" src="assets/js/pages/auth-login.js"></script>
</body>
</html>
