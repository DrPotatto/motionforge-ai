<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand kit — MotionForge AI</title>
<meta name="description" content="Brand kit">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="Brand kit — MotionForge AI">
<meta property="og:description" content="Brand kit">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d10'/%3E%3Cpath d='M22 68V32l14 22 14-22v36' stroke='%23ff8a3d' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand"><svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b0d10" stroke="#232a32"/><path d="M22 68V32l14 22 14-22v36" stroke="#ff8a3d" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 68V32h16a12 12 0 0 1 0 24H62" stroke="#a78bfa" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sidebar__brand-name" data-brand>MotionForge</span></div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__footer"><div class="sidebar__account">
      <div class="flex items-center gap-2">
        <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#ff8a3d,#8b6dff);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0b0d10">MF</div>
        <div style="min-width:0">
          <div id="account-email" class="truncate" style="font-size:12px;font-weight:500">Local workspace</div>
          <div id="account-plan" style="font-size:10px;color:var(--text-muted)">Free · demo mode</div>
        </div>
      </div>
      <a href="index.html" style="display:block;margin-top:8px;font-size:11px;color:var(--text-muted)">Back to site</a>
    </div></div>
  </aside>
  <div class="app-main">
    <header class="app-header">
      <button class="btn btn-subtle sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
      <span style="font-size:13px;color:var(--text-muted)">Studio workspace</span>
      <div class="ml-auto flex items-center gap-2">
        <span class="chip" id="engine-chip">Local engine</span>
        <a href="app.html" class="btn btn-primary btn-sm">New project</a>
      </div>
    </header>
    <main class="app-content">

      <div class="container"><div style="padding:40px 0;max-width:720px;margin:0 auto">
        <div class="label">Brand</div>
        <h1 style="font-family:var(--font-display);font-size:32px;margin:6px 0 0">Brand kit</h1>
        <p style="color:var(--text-secondary);margin-top:8px">Reusable identity applied across every project.</p>
        <div class="panel panel-pad" style="margin-top:32px">
          <label><span class="label">Brand name</span><input id="brandName" class="field mt-1" value="MotionForge"></label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
            <label><span class="label">Accent</span><div class="flex items-center gap-2 mt-1"><input type="color" id="accent"><input id="accentText" class="field field-sm flex-1"></div></label>
            <label><span class="label">Secondary</span><div class="flex items-center gap-2 mt-1"><input type="color" id="secondary"><input id="secondaryText" class="field field-sm flex-1"></div></label>
            <label><span class="label">Text</span><div class="flex items-center gap-2 mt-1"><input type="color" id="text"><input id="textText" class="field field-sm flex-1"></div></label>
            <label><span class="label">Background</span><div class="flex items-center gap-2 mt-1"><input type="color" id="background"><input id="backgroundText" class="field field-sm flex-1"></div></label>
          </div>
          <label style="display:block;margin-top:16px"><span class="label">Font family</span>
            <select id="fontFamily" class="field mt-1">
              <option value='"Space Grotesk"'>Space Grotesk</option>
              <option value="Inter">Inter</option>
              <option value='"JetBrains Mono"'>JetBrains Mono</option>
              <option value='"Noto Sans Arabic"'>Noto Sans Arabic</option>
            </select>
          </label>
        </div>
      </div></div>
    </main>
  </div>
</div>
<script src="config.js"></script>
<script type="module" src="assets/js/pages/brand.js"></script>
</body>
</html>
