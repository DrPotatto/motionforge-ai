<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — MotionForge AI</title>
<meta name="description" content="Motion editor.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="Editor — MotionForge AI">
<meta property="og:description" content="Motion editor.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d10'/%3E%3Cpath d='M22 68V32l14 22 14-22v36' stroke='%23ff8a3d' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/editor.css">
</head>
<body>
<div class="editor-shell">
  <header class="editor-topbar">
    <a href="projects.html" class="btn btn-subtle btn-icon" aria-label="Back to projects">←</a>
    <input type="text" id="project-name" value="Untitled project" aria-label="Project name">
    <span id="save-indicator" class="save-indicator">Saved</span>
    <span id="spec-source" class="badge badge--info" style="margin-left:6px">Local engine</span>
    <div class="ml-auto flex items-center gap-2">
      <button id="btn-undo" class="btn btn-subtle btn-icon" title="Undo" aria-label="Undo">↶</button>
      <button id="btn-redo" class="btn btn-subtle btn-icon" title="Redo" aria-label="Redo">↷</button>
      <button id="btn-guides" class="btn btn-ghost btn-sm">Guides</button>
      <button id="btn-export" class="btn btn-primary btn-sm">Export</button>
    </div>
  </header>
  <div class="editor-body">
    <aside class="editor-panel editor-panel--left">
      <div class="panel-header"><span class="label">Scenes</span><button id="btn-add-scene" class="btn btn-subtle btn-sm ml-auto">+ Add</button></div>
      <div class="scene-list" id="scene-list"></div>
      <div class="panel-header" style="border-top:1px solid var(--ink-800)"><span class="label">Layers</span><button id="btn-add-text" class="btn btn-subtle btn-sm ml-auto">+ Text</button></div>
      <div class="scene-list" id="layer-list" style="max-height:220px"></div>
    </aside>
    <div class="resizer" id="resizer-left"></div>
    <section class="editor-center">
      <div class="preview-area" id="preview-area"><canvas id="preview-canvas" aria-label="Animation preview"></canvas></div>
      <div class="transport">
        <button id="btn-play" class="btn btn-ghost btn-sm" aria-label="Play/pause">▶</button>
        <button id="btn-restart" class="btn btn-subtle btn-sm" aria-label="Restart">⏮</button>
        <span id="time-display" class="transport__time">0:00.00 / 0:00.00</span>
        <span id="scene-info" class="ml-auto" style="font-size:11px;color:var(--text-muted)"></span>
      </div>
      <div class="timeline">
        <div class="timeline__header">Timeline</div>
        <div class="timeline__body">
          <div class="timeline__track" id="timeline-track"><div class="timeline__playhead" id="playhead" style="left:0%"></div></div>
          <div class="timeline__controls" id="timeline-controls"></div>
        </div>
      </div>
    </section>
    <div class="resizer" id="resizer-right"></div>
    <aside class="editor-panel editor-panel--right">
      <div class="panel-header"><span class="label">Inspector</span></div>
      <div class="inspector-body" id="inspector"></div>
    </aside>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast-stack" id="toast-stack"></div>
<script src="config.js"></script>
<script type="module" src="assets/js/pages/editor.js"></script>
</body>
</html>
